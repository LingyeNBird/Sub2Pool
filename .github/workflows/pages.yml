name: GitHub Pages 演示

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建合成数据演示
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: 启用 pnpm
        run: corepack enable

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 检查前端
        working-directory: frontend
        run: pnpm check

      - name: 构建演示站
        working-directory: frontend
        env:
          VITE_PUBLIC_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build:demo

      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    name: 发布 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
