name: Billing corrections review
on:
  push:
    branches: [feat/traceable-billing-corrections]
    paths: [.github/workflows/billing-corrections-review.yml]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive branch sources for verified repair
        run: git archive --format=tar.gz HEAD > /tmp/sub2pool-repair-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: billing-corrections-repair-source
          path: /tmp/sub2pool-repair-source.tar.gz
          retention-days: 3
