[project]
name = "sub2api-carpool-monitor"
version = "1.0.0"
description = "Sub2API 拼车额度测算与人工调整建议服务"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45.0,<46",
  "django>=5.2,<5.3",
  "gunicorn>=23.0,<24",
  "httpx>=0.28,<0.29",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-django>=4.11,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pinche.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.uv]
package = false
