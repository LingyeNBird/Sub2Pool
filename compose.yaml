services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?请在 .env 中设置 DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-Asia/Shanghai}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?请在 .env 中设置 ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      PINCH_DATA_DIR: /app/data
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      WEBRTC_IP_COLLECTION_ENABLED: ${WEBRTC_IP_COLLECTION_ENABLED:-true}
      WEBRTC_STUN_URL: ${WEBRTC_STUN_URL:-stun:stun.l.google.com:19302}
    volumes:
      - pinche-data:/app/data
    ports:
      - "${WEB_PORT:-8088}:8000"
    # 让容器能访问宿主机上已暴露端口的 Sub2API；Windows/macOS 原生支持，
    # Linux 通过 host-gateway 获得同名地址。也可在设置页改为远程 HTTPS 地址。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pinche-data:
